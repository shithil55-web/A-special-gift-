<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>একটা ছোট্ট উপহার ❤️</title>


<style>

/* =====================================================
   BASIC
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{

    width:100%;
    height:100%;

    overflow:hidden;
}

body{

    font-family:
        "Noto Sans Bengali",
        "SolaimanLipi",
        Arial,
        sans-serif;

    background:#020005;
}


/* =====================================================
   GIFT SCREEN
===================================================== */

#giftScreen{

    position:fixed;

    inset:0;

    z-index:9999;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

    overflow:hidden;

    background:
        radial-gradient(
            ellipse at 50% 32%,
            rgba(105,0,55,.48) 0%,
            rgba(38,0,27,.80) 34%,
            rgba(9,0,14,.97) 68%,
            #000 100%
        );

    transition:
        opacity 1.2s ease,
        transform 1.2s ease;
}


/* Romantic aura */

#giftScreen::before{

    content:"";

    position:absolute;

    inset:-20%;

    background:

        radial-gradient(
            circle at 20% 30%,
            rgba(255,20,147,.13),
            transparent 20%
        ),

        radial-gradient(
            circle at 80% 25%,
            rgba(120,0,255,.10),
            transparent 22%
        ),

        radial-gradient(
            circle at 50% 80%,
            rgba(255,0,100,.08),
            transparent 25%
        );

    filter:blur(35px);

    animation:
        romanticAura
        8s ease-in-out infinite alternate;

    pointer-events:none;
}

@keyframes romanticAura{

    from{

        transform:scale(1);

        opacity:.55;
    }

    to{

        transform:scale(1.15);

        opacity:1;
    }
}


/* Moon */

#giftScreen::after{

    content:"";

    position:absolute;

    width:140px;
    height:140px;

    top:7%;
    right:10%;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,225,242,.20),
            rgba(255,120,190,.07) 35%,
            transparent 72%
        );

    box-shadow:
        0 0 45px rgba(255,100,180,.08),
        0 0 110px rgba(255,20,147,.05);

    filter:blur(2px);

    animation:
        moonGlow
        4s ease-in-out infinite alternate;

    pointer-events:none;
}

@keyframes moonGlow{

    from{

        transform:scale(.9);

        opacity:.5;
    }

    to{

        transform:scale(1.1);

        opacity:1;
    }
}


/* =====================================================
   GIFT GLOW
===================================================== */

.giftGlow{

    position:absolute;

    width:340px;
    height:340px;

    left:50%;
    top:39%;

    transform:
        translate(-50%,-50%);

    background:#ff0080;

    border-radius:50%;

    filter:blur(130px);

    opacity:.18;

    animation:
        giftGlow
        3s ease-in-out infinite alternate;
}

@keyframes giftGlow{

    from{

        transform:
            translate(-50%,-50%)
            scale(.8);

        opacity:.10;
    }

    to{

        transform:
            translate(-50%,-50%)
            scale(1.3);

        opacity:.26;
    }
}


/* =====================================================
   PROPOSAL ANIMATION SCENE
===================================================== */

.proposeScene{

    position:absolute;

    left:50%;
    top:17%;

    width:330px;
    height:235px;

    transform:
        translateX(-50%);

    z-index:20;
}


/* Ground */

.ground{

    position:absolute;

    left:50%;
    bottom:18px;

    width:270px;
    height:25px;

    transform:
        translateX(-50%);

    background:
        radial-gradient(
            ellipse,
            rgba(255,20,147,.30),
            transparent 70%
        );

    border-radius:50%;

    filter:blur(13px);

    animation:
        groundGlow
        3s ease-in-out infinite alternate;
}

@keyframes groundGlow{

    from{

        opacity:.3;

        transform:
            translateX(-50%)
            scale(.85);
    }

    to{

        opacity:.75;

        transform:
            translateX(-50%)
            scale(1.1);
    }
}


/* =====================================================
   GIRL
===================================================== */

.girl{

    position:absolute;

    right:38px;
    bottom:28px;

    width:55px;
    height:145px;

    filter:
        drop-shadow(
            0 0 8px
            rgba(255,105,180,.38)
        );

    animation:
        girlBreath
        3s ease-in-out infinite;
}


.girl .hair{

    position:absolute;

    left:8px;
    top:-2px;

    width:40px;
    height:52px;

    background:
        linear-gradient(
            180deg,
            #07040a,
            #24101d
        );

    border-radius:
        50% 50% 45% 45%;

    z-index:3;
}


.girl .head{

    position:absolute;

    left:15px;
    top:8px;

    width:29px;
    height:32px;

    background:
        linear-gradient(
            135deg,
            #ffd0c0,
            #d9968a
        );

    border-radius:50%;

    z-index:2;

    opacity:.9;
}


.girl .body{

    position:absolute;

    left:10px;
    top:38px;

    width:36px;
    height:73px;

    background:
        linear-gradient(
            135deg,
            #c00070,
            #42062e
        );

    border-radius:
        18px 18px 8px 8px;

    clip-path:
        polygon(
            25% 0,
            75% 0,
            100% 100%,
            0 100%
        );

    box-shadow:
        0 0 16px
        rgba(255,20,147,.20);
}


.girl .leg1,
.girl .leg2{

    position:absolute;

    top:103px;

    width:6px;
    height:36px;

    background:#21121c;

    border-radius:5px;
}

.girl .leg1{
    left:19px;
}

.girl .leg2{
    left:31px;
}


@keyframes girlBreath{

    0%,100%{

        transform:
            translateY(0);
    }

    50%{

        transform:
            translateY(-2px);
    }
}


/* =====================================================
   BOY
===================================================== */

.boy{

    position:absolute;

    left:18px;
    bottom:28px;

    width:58px;
    height:145px;

    filter:
        drop-shadow(
            0 0 8px
            rgba(100,100,255,.30)
        );

    animation:
        boyProposal
        5.5s
        cubic-bezier(.65,0,.35,1)
        forwards;
}


.boy .head{

    position:absolute;

    left:15px;
    top:8px;

    width:30px;
    height:32px;

    background:
        linear-gradient(
            135deg,
            #c98d70,
            #8c5847
        );

    border-radius:50%;

    z-index:3;
}


.boy .hair{

    position:absolute;

    left:13px;
    top:2px;

    width:34px;
    height:18px;

    background:#07060a;

    border-radius:
        60% 60% 30% 30%;

    z-index:5;
}


.boy .body{

    position:absolute;

    left:12px;
    top:38px;

    width:38px;
    height:70px;

    background:
        linear-gradient(
            135deg,
            #202957,
            #090d24
        );

    border-radius:
        14px 14px 7px 7px;

    box-shadow:
        0 0 15px
        rgba(80,100,255,.16);
}


.boy .leg1,
.boy .leg2{

    position:absolute;

    top:102px;

    width:9px;
    height:38px;

    background:#080b19;

    border-radius:6px;
}

.boy .leg1{
    left:14px;
}

.boy .leg2{
    left:31px;
}


.boy .arm{

    position:absolute;

    left:34px;
    top:48px;

    width:43px;
    height:7px;

    background:#b77b62;

    border-radius:10px;

    transform-origin:left center;

    transform:
        rotate(-15deg);

    z-index:8;

    animation:
        armOffer
        5.5s
        ease-in-out
        forwards;
}


@keyframes armOffer{

    0%,55%{

        transform:
            rotate(-15deg);
    }

    70%{

        transform:
            rotate(-5deg);
    }

    100%{

        transform:
            rotate(-2deg);
    }
}


/* Boy walks and kneels */

@keyframes boyProposal{

    0%{

        transform:
            translateX(0)
            translateY(0);
    }

    40%{

        transform:
            translateX(95px)
            translateY(0);
    }

    54%{

        transform:
            translateX(115px)
            translateY(0);
    }

    70%{

        transform:
            translateX(115px)
            translateY(24px)
            scale(.86);
    }

    100%{

        transform:
            translateX(115px)
            translateY(24px)
            scale(.86);
    }
}


/* =====================================================
   HEART OFFER
===================================================== */

.proposeHeart{

    position:absolute;

    left:176px;
    top:75px;

    z-index:30;

    font-size:25px;

    opacity:0;

    filter:
        drop-shadow(0 0 5px #ff69b4)
        drop-shadow(0 0 15px #ff1493)
        drop-shadow(0 0 30px #ff0080);

    animation:
        heartOffer
        5.5s
        ease-in-out
        forwards;
}

@keyframes heartOffer{

    0%,55%{

        opacity:0;

        transform:
            scale(.2)
            translateY(10px);
    }

    65%{

        opacity:1;

        transform:
            scale(1.3)
            translateY(0);
    }

    75%,100%{

        opacity:1;

        transform:
            scale(1)
            translateY(0);
    }
}


/* =====================================================
   SMALL FLOATING HEARTS
===================================================== */

.miniHeart{

    position:absolute;

    color:#ff69b4;

    font-size:12px;

    opacity:0;

    text-shadow:
        0 0 8px #ff1493,
        0 0 18px #ff0080;

    animation:
        cinematicFloat
        5s
        ease-in-out
        infinite;
}

.miniHeart:nth-child(1){

    left:35px;
    top:80px;

    animation-delay:.8s;
}

.miniHeart:nth-child(2){

    left:270px;
    top:65px;

    animation-delay:1.7s;
}

.miniHeart:nth-child(3){

    left:80px;
    top:20px;

    animation-delay:2.4s;
}

.miniHeart:nth-child(4){

    left:235px;
    top:120px;

    animation-delay:3s;
}


@keyframes cinematicFloat{

    0%{

        opacity:0;

        transform:
            translateY(15px)
            scale(.5);
    }

    25%{

        opacity:.8;
    }

    65%{

        opacity:.7;
    }

    100%{

        opacity:0;

        transform:
            translateY(-35px)
            scale(1.2);
    }
}


/* =====================================================
   GIFT CONTENT
===================================================== */

.giftContent{

    position:absolute;

    z-index:50;

    left:50%;

    bottom:4%;

    transform:
        translateX(-50%);

    width:90%;

    max-width:450px;
}


.giftSmall{

    color:#ff9dcc;

    font-size:13px;

    letter-spacing:4px;

    margin-bottom:10px;

    text-shadow:
        0 0 10px #ff1493;
}


.giftTitle{

    color:white;

    font-size:28px;

    margin-bottom:7px;

    text-shadow:
        0 0 10px #ff69b4,
        0 0 25px #ff1493,
        0 0 45px #ff0080;
}


.giftSubtitle{

    color:#ffb6d9;

    font-size:13px;

    margin-bottom:18px;
}


/* =====================================================
   BUTTON
===================================================== */

.openBtn{

    position:relative;

    border:none;

    outline:none;

    cursor:pointer;

    padding:
        15px 32px;

    border-radius:50px;

    color:white;

    font-size:15px;

    font-weight:bold;

    letter-spacing:1px;

    background:
        linear-gradient(
            135deg,
            #ff1493,
            #ff007f,
            #c000ff
        );

    box-shadow:
        0 0 10px #ff1493,
        0 0 25px #ff1493,
        0 0 50px #ff0080;

    overflow:hidden;

    animation:
        buttonPulse
        2s
        ease-in-out
        infinite;
}


@keyframes buttonPulse{

    0%,100%{

        transform:
            scale(1);
    }

    50%{

        transform:
            scale(1.05);
    }
}


.openBtn::before{

    content:"";

    position:absolute;

    top:0;
    left:-100%;

    width:60%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.55),
            transparent
        );

    transform:
        skewX(-20deg);

    animation:
        buttonShine
        2.5s
        infinite;
}


@keyframes buttonShine{

    0%{
        left:-100%;
    }

    50%,100%{
        left:150%;
    }
}


/* =====================================================
   MAIN SCENE
===================================================== */

#scene{

    position:relative;

    width:100%;

    height:100vh;

    overflow:hidden;

    background:
        radial-gradient(
            circle at center,
            #3b001f 0%,
            #18000f 30%,
            #060008 65%,
            #000 100%
        );

    opacity:0;

    visibility:hidden;

    transition:
        opacity 1.5s ease;
}


/* Main glow */

.glow{

    position:absolute;

    width:400px;
    height:400px;

    left:50%;
    top:35%;

    transform:
        translate(-50%,-50%);

    background:#ff0080;

    border-radius:50%;

    filter:blur(140px);

    opacity:.18;

    animation:
        bgGlow
        3s
        ease-in-out
        infinite alternate;
}

@keyframes bgGlow{

    from{

        transform:
            translate(-50%,-50%)
            scale(.8);

        opacity:.12;
    }

    to{

        transform:
            translate(-50%,-50%)
            scale(1.3);

        opacity:.27;
    }
}


/* =====================================================
   3D HEART
===================================================== */

#heart{

    position:absolute;

    width:100%;
    height:100%;

    perspective:1400px;

    transform-style:preserve-3d;
}


.love{

    position:absolute;

    transform-style:preserve-3d;

    white-space:nowrap;

    pointer-events:none;
}


.loveText{

    color:#ffb5d9;

    font-size:11px;

    font-weight:bold;

    letter-spacing:.5px;

    text-shadow:
        0 0 4px #fff,
        0 0 8px #ff69b4,
        0 0 15px #ff1493,
        0 0 30px #ff0080;

    animation:
        textGlow
        1.5s
        ease-in-out
        infinite alternate;
}


@keyframes textGlow{

    from{

        opacity:.25;

        filter:
            brightness(.7);
    }

    to{

        opacity:1;

        filter:
            brightness(1.6);
    }
}


/* =====================================================
   CENTER
===================================================== */

.center{

    position:absolute;

    left:50%;
    top:27%;

    transform:
        translate(-50%,-50%);

    text-align:center;

    z-index:1000;

    width:90%;

    pointer-events:none;
}


.small{

    color:#ff8fc5;

    font-size:11px;

    letter-spacing:4px;

    margin-bottom:8px;

    text-shadow:
        0 0 12px #ff1493;
}


.title{

    font-size:42px;

    font-weight:800;

    background:
        linear-gradient(
            90deg,
            #fff,
            #ffb6d9,
            #ff1493,
            #fff,
            #ffb6d9
        );

    background-size:400% auto;

    -webkit-background-clip:text;

    background-clip:text;

    color:transparent;

    animation:
        gradient
        4s
        linear
        infinite,

        titlePulse
        1.8s
        ease-in-out
        infinite alternate;

    filter:
        drop-shadow(
            0 0 8px #ff1493
        )
        drop-shadow(
            0 0 20px #ff0080
        );
}


@keyframes gradient{

    to{

        background-position:
            400% center;
    }
}


@keyframes titlePulse{

    from{

        transform:
            scale(.95);
    }

    to{

        transform:
            scale(1.08);
    }
}


.subtitle{

    margin-top:8px;

    color:#ffd3e8;

    font-size:13px;

    letter-spacing:2px;

    text-shadow:
        0 0 8px #ff1493,
        0 0 18px #ff1493;
}


/* =====================================================
   BIG HEART
===================================================== */

.bigHeart{

    margin:
        17px auto 0;

    width:32px;
    height:32px;

    background:#ff167f;

    transform:
        rotate(-45deg);

    box-shadow:
        0 0 10px #ff1493,
        0 0 25px #ff1493,
        0 0 50px #ff0080;

    animation:
        heartBeat
        1s
        infinite;
}


.bigHeart:before,
.bigHeart:after{

    content:"";

    position:absolute;

    width:32px;
    height:32px;

    background:#ff167f;

    border-radius:50%;
}


.bigHeart:before{

    top:-16px;

    left:0;
}


.bigHeart:after{

    top:0;

    left:16px;
}


@keyframes heartBeat{

    0%,100%{

        transform:
            rotate(-45deg)
            scale(1);
    }

    50%{

        transform:
            rotate(-45deg)
            scale(1.25);
    }
}


/* =====================================================
   PROPOSAL MESSAGE
   DESIGNED TO FIT MOBILE
===================================================== */

.proposal{

    position:absolute;

    left:50%;

    /*
       IMPORTANT:
       নিচে একদম screen edge-এ নয়
    */

    bottom:12px;

    transform:
        translateX(-50%);

    width:94%;

    max-width:650px;

    padding:
        9px 8px 8px;

    text-align:center;

    z-index:2000;

    color:#ffe6f2;

    /*
       Mobile friendly font
    */

    font-size:11px;

    line-height:1.42;

    background:
        linear-gradient(
            135deg,
            rgba(255,20,147,.11),
            rgba(255,0,128,.05),
            rgba(160,0,255,.08)
        );

    border:
        1px solid
        rgba(255,140,200,.28);

    border-radius:16px;

    box-shadow:
        0 0 18px
        rgba(255,20,147,.15),

        inset 0 0 20px
        rgba(255,20,147,.04);

    backdrop-filter:
        blur(6px);

    -webkit-backdrop-filter:
        blur(6px);

    animation:
        proposalGlow
        2.5s
        ease-in-out
        infinite alternate;
}


/* Glowing top line */

.proposal::before{

    content:"";

    position:absolute;

    left:15%;

    right:15%;

    top:0;

    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #ff69b4,
            #fff,
            #ff1493,
            transparent
        );

    box-shadow:
        0 0 8px #ff1493;

    animation:
        borderMove
        3s
        linear
        infinite;
}


@keyframes borderMove{

    0%{

        opacity:.3;

        transform:
            scaleX(.5);
    }

    50%{

        opacity:1;

        transform:
            scaleX(1);
    }

    100%{

        opacity:.3;

        transform:
            scaleX(.5);
    }
}


/* Proposal lines */

.proposal .line{

    position:relative;

    opacity:0;

    margin:0;

    text-shadow:
        0 0 4px #ff69b4,
        0 0 10px #ff1493;

    animation:
        lineAppear
        1s
        cubic-bezier(.2,.8,.2,1)
        forwards;
}


/* Small heart */

.proposal .line::before{

    content:"♥";

    display:inline-block;

    margin-right:4px;

    color:#ff69b4;

    font-size:7px;

    text-shadow:
        0 0 7px #ff1493;
}


/* Line delays */

.proposal .line:nth-child(1){
    animation-delay:.4s;
}

.proposal .line:nth-child(2){
    animation-delay:1s;
}

.proposal .line:nth-child(3){
    animation-delay:1.6s;
}

.proposal .line:nth-child(4){
    animation-delay:2.2s;
}

.proposal .line:nth-child(5){
    animation-delay:2.8s;
}

.proposal .line:nth-child(6){
    animation-delay:3.4s;
}

.proposal .line:nth-child(7){
    animation-delay:4s;
}


/* Signature */

.signature{

    margin-top:4px;

    padding-top:4px;

    border-top:
        1px solid
        rgba(255,130,190,.15);

    color:#ff9dcc;

    font-size:13px;

    font-weight:bold;

    opacity:0;

    text-shadow:
        0 0 8px #ff1493,
